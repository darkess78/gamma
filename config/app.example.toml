[minecraft]
enabled = false
maximum_inbound_bytes = 65536

[resource_routing.policy]
shadow_mode = false
active_llm_routing = false
startup_admission = false
snapshot_max_age_seconds = 5
reservation_ttl_seconds = 30
sidecar_allocation_ttl_seconds = 300
minimum_headroom_mb = 2048
default_estimated_vram_mb = 0
qwen_tts_estimated_vram_mb = 0
audio_understanding_estimated_vram_mb = 0

# Resource-routing targets are advisory examples only. Keep them disabled in
# shared config, then copy the shapes into config/app.local.toml with real
# endpoint refs, GPU UUIDs, model lists, and per-machine limits.
[resource_routing.endpoints]
local_ollama_gpu_0 = "http://127.0.0.1:11434"
local_ollama_gpu_1 = "http://127.0.0.1:11435"
local_ollama_cpu = "http://127.0.0.1:11436"
qwen_tts_local = "http://127.0.0.1:9882"
audio_understanding_local = "http://127.0.0.1:9883"

[[resource_routing.targets]]
id = "ollama_gpu_0"
kind = "ollama"
provider = "local"
endpoint_ref = "local_ollama_gpu_0"
device = "cuda:0"
models = ["gpt-oss:20b", "gemma4:e4b"]
modalities = ["text"]
enabled = false
managed = false
reserved_vram_mb = 2048

[[resource_routing.targets]]
id = "ollama_gpu_1"
kind = "ollama"
provider = "local"
endpoint_ref = "local_ollama_gpu_1"
device = "cuda:1"
models = ["gpt-oss:20b", "gemma4:e4b"]
modalities = ["text"]
enabled = false
managed = false
reserved_vram_mb = 2048

[[resource_routing.targets]]
id = "cpu_llm_sidecar"
kind = "ollama"
provider = "local"
endpoint_ref = "local_ollama_cpu"
device = "cpu"
models = ["gemma4:e4b"]
modalities = ["text"]
enabled = false
managed = false

[[resource_routing.targets]]
id = "qwen_tts_cpu"
kind = "qwen-tts"
provider = "qwen-tts"
endpoint_ref = "qwen_tts_local"
device = "cpu"
models = ["qwen-tts"]
modalities = ["speech"]
enabled = false
managed = false

[[resource_routing.targets]]
id = "audio_understanding_cpu"
kind = "audio-understanding"
provider = "audio-understanding"
endpoint_ref = "audio_understanding_local"
device = "cpu"
models = ["superb/wav2vec2-base-superb-er", "MIT/ast-finetuned-audioset-10-10-0.4593"]
modalities = ["audio"]
enabled = false
managed = false

