version = 1

[policy]
maximum_records_per_source = 5000
dominant_stage_share_percent = 25.0
first_audio_warning_ms = 5000.0
isolated_experiments_enabled = false
experiment_worktree_root = "./data/improvement/worktrees"

[policy.required_gates]
runtime_adaptation = ["automated_tests", "health_checks", "rollback_ready"]
tracked_configuration = ["automated_tests", "health_checks", "rollback_ready", "soak_check"]
behavior_or_code = ["automated_tests", "diff_review", "safety_privacy", "holdout_evaluation", "health_checks", "rollback_ready", "human_approval"]
restricted_operation = ["automated_tests", "diff_review", "safety_privacy", "health_checks", "rollback_ready", "human_approval", "manual_operation"]

[[metrics]]
id = "conversation.total_ms"
source = "conversation"
path = "timing_ms.total_ms"
role = "objective"
direction = "lower"
statistic = "p95"
unit = "ms"
minimum_samples = 20
minimum_practical_change_percent = 5.0
maximum_regression_percent = 3.0

[[metrics]]
id = "conversation.draft_reply_ms"
source = "conversation"
path = "timing_ms.draft_reply_ms"
role = "diagnostic"
direction = "lower"
