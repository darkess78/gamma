# Speaker identity profiles (TEMPLATE - this file is public in the repo)
#
# Put real names, notes and platform ids in config/users.local.toml, which git ignores.
# It uses the same layout and its values override these.
#
# trust levels:
#   owner        - full access, personal memory, established relationship
#   trusted      - friendly, own stored facts, limited tools
#   guest        - polite but impersonal, no memory persistence
#   public       - minimal engagement, no memory, no tools
#
# platform_ids: map platform names to their identifier for this person
#   discord      - Discord user ID (integer as string)
#   game         - comma-separated list of known in-game usernames
#
# A caller that names no speaker is an unknown speaker, never the owner. The owner is
# recognised through the dashboard's owner channel, the local command-line tools, or the
# platform ids below. Only the owner can save memories about the owner.

[owner]
name = "Owner"
trust = "owner"
notes = ""

[owner.platform_ids]
discord = ""          # fill in your Discord user ID
game = ""    # comma-separated game usernames

# --- Trusted guests ---
# Copy this block and adjust for each person you want to recognize.

# [guests.example]
# name = "Alice"
# trust = "trusted"
# notes = "Close friend. Be friendly, remember what they share, but maintain appropriate distance."
#
# [guests.example.platform_ids]
# discord = ""        # Alice's Discord user ID
# game = ""           # Alice's game username(s)
