<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shana · private presence</title>
  <style>
    :root{color-scheme:dark;font:15px/1.5 system-ui,sans-serif;background:#11151d;color:#e7edf7}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;display:flex;justify-content:center;align-items:flex-end}
    button,input,select,textarea{font:inherit}button,select{background:#242c3a;color:inherit;border:1px solid #48556b;border-radius:7px;padding:7px 11px;cursor:pointer}button:hover{background:#303d51}button:disabled{opacity:.5;cursor:default}
    input[type=checkbox]{accent-color:#aab8f7}textarea{width:100%;background:#121923;color:inherit;border:1px solid #48556b;border-radius:7px;padding:9px;resize:vertical}
    [hidden]{display:none!important}main{width:min(100%,590px);border:1px solid #38465a;border-radius:18px;background:#19212ded;padding:19px;box-shadow:0 15px 60px #0006}
    header{display:flex;align-items:center;justify-content:space-between;gap:15px}h1{font-size:18px;margin:0;font-weight:600}p{margin:7px 0}.subtle{color:#aebbd0;font-size:13px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}.row label{display:flex;gap:7px;align-items:center}.grow{flex:1}
    #avatarRegion{display:flex;align-items:center;gap:20px;padding:14px 0}#avatar{width:118px;height:138px;flex-shrink:0;filter:drop-shadow(0 6px 14px #0004)}
    #avatar .blink{transform-origin:center;animation:blink 6.7s infinite}#avatar .mouth{transform-origin:90px 111px}body[data-speaking=true] #avatar .mouth{animation:speak .24s ease-in-out infinite alternate}body[data-awake=false] #avatar .blink{transform:scaleY(.18);animation:none}
    @keyframes blink{0%,45%,48%,100%{transform:scaleY(1)}46%,47%{transform:scaleY(.1)}}@keyframes speak{to{transform:scaleY(2)}}
    #caption{white-space:pre-wrap;overflow-wrap:anywhere;max-height:210px;overflow:auto}#connectionStatus{color:#bcc8ff}#availability{font-weight:500}#micStatus{min-height:1.5em}.meter{width:90px;height:6px;background:#10151e;border-radius:5px;overflow:hidden}.meter span{display:block;width:0;height:100%;background:#a3b9ec}
    body[data-placement=left]{justify-content:flex-start}body[data-placement=right]{justify-content:flex-end}body[data-placement=center]{align-items:center}body.compact main{max-width:365px}body.compact .details{display:none}body.compact #avatar{width:65px;height:80px}body.compact #avatarRegion{gap:12px;padding:0}
    @media(prefers-reduced-motion:reduce){#avatar *{animation:none!important}}
  </style>
  <script src="/static/presence_queue.js" defer></script>
  <script src="/static/private_presence.js" defer></script>
</head>
<body data-awake="false" data-placement="right">
<main>
  <header><h1>Shana</h1><span class="subtle">Private session</span></header>
  <p><label><input id="privateConfirm" type="checkbox"> I am here privately and can receive private output.</label></p>
  <p id="connectionStatus" role="status">Private audience not confirmed.</p>
  <section id="presenceControls" hidden>
    <div id="avatarRegion">
      <svg id="avatar" viewBox="0 0 180 210" role="img" aria-label="Shana's presentation avatar">
        <path d="M21 197c5-38 30-53 69-53s64 15 69 53" fill="#617099"/>
        <path d="M31 102C10 20 55 6 92 9c51-3 76 37 57 98l-5 48H35z" fill="#353347"/>
        <ellipse cx="90" cy="89" rx="48" ry="61" fill="#e3c7c2"/>
        <path d="M39 80c-7-48 27-64 56-64 39-1 59 22 56 63-25-6-38-18-52-36-11 25-37 35-60 37" fill="#45405b"/>
        <g class="blink"><ellipse cx="70" cy="91" rx="6" ry="9" fill="#3e3a59"/><ellipse cx="111" cy="91" rx="6" ry="9" fill="#3e3a59"/></g>
        <path class="mouth" d="M83 115q7 5 14 0" stroke="#8c6570" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M41 69c-15 31-14 65 0 91M139 65c19 38 16 71 1 94" stroke="#45405b" stroke-width="15" fill="none"/>
      </svg>
      <div class="grow"><p id="availability">Connecting</p><p id="caption" aria-live="polite"></p><p id="deliveryStatus" class="subtle"></p></div>
    </div>
    <div class="row">
      <button id="voiceToggle" type="button">Start listening</button>
      <button id="muteToggle" type="button">Enable speech</button>
      <button id="stopPlayback" type="button">Stop speaking</button>
      <button id="sleepToggle" type="button">Wake</button>
    </div>
    <div class="details">
      <label><input id="ownerSource" type="checkbox"> This microphone carries my voice. Other speakers are observations, not owner commands.</label>
      <div class="row"><span id="micStatus" class="subtle">Microphone off</span><div class="meter" aria-hidden="true"><span id="micMeter"></span></div></div>
      <form id="textForm"><label for="privateText">Talk by text</label><textarea id="privateText" rows="2" maxlength="8000" placeholder="A message for Shana"></textarea><div class="row"><button id="sendText" type="submit">Send</button><span id="inputStatus" class="subtle" role="status"></span></div></form>
    </div>
    <div class="row">
      <button id="avatarToggle" type="button">Hide avatar</button>
      <button id="compactToggle" type="button">Compact</button>
      <button id="reconnect" type="button">Reconnect</button>
      <label class="subtle">Placement <select id="placement"><option value="right">Right</option><option value="left">Left</option><option value="center">Center</option></select></label>
    </div>
    <p class="subtle details">Hiding or minimizing this window does not put Shana to sleep. Listening and speech have separate controls. The native window controls minimize or move this presentation.</p>
  </section>
</main>
</body></html>
