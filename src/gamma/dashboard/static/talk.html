<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talk with Shana</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/dashboard.css?v=20260528b">
  <link rel="stylesheet" href="/static/talk.css?v=20260622">
</head>
<body class="talk-page">
  <main class="talk-shell">
    <header class="talk-header">
      <div>
        <p class="talk-kicker">Shana</p>
        <h1>Talk</h1>
      </div>
      <nav aria-label="Talk navigation">
        <a class="nav-link" href="/dashboard">Dashboard</a>
        <button class="btn secondary" id="newConversationButton" type="button">New conversation</button>
      </nav>
    </header>

    <section class="talk-card" aria-labelledby="textConversationHeading">
      <div class="talk-section-heading">
        <div>
          <h2 id="textConversationHeading">Text conversation</h2>
          <p>Messages here and live voice share the same Shana session.</p>
        </div>
        <span class="status-chip" id="talkStatus" role="status">Ready</span>
      </div>
      <div class="talk-history" id="talkHistory" aria-live="polite"></div>
      <form class="talk-composer" id="talkForm">
        <label class="sr-only" for="talkInput">Message Shana</label>
        <textarea id="talkInput" rows="3" maxlength="8000" placeholder="Message Shana…" required></textarea>
        <button class="btn" id="talkSendButton" type="submit">Send</button>
      </form>
      <p class="talk-hint">Enter sends. Shift+Enter adds a line.</p>
    </section>

    <section class="talk-voice-heading" aria-labelledby="voiceConversationHeading">
      <h2 id="voiceConversationHeading">Live voice</h2>
      <p>Start the microphone when you want a hands-free conversation. Browser microphone access requires HTTPS or localhost.</p>
    </section>
    <!-- GAMMA_LIVE_VOICE_PANEL -->
  </main>

  <script src="/static/live.js?v=20260622"></script>
  <script type="module" src="/static/talk.mjs?v=20260622"></script>
</body>
</html>
